  // ---------- maths ----------
  function num(v) {
    const n = parseFloat(String(v == null ? "" : v).replace(",", ".").replace(/[^0-9.\-]/g, ""));
    return isFinite(n) ? n : 0;
  }
  function own(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
  // Quantities are whole numbers; anything else (negative, fractional) counts as 0 and is flagged at lock time.
  function qty(v) {
    const t = String(v == null ? "" : v).trim();
    return t === "" ? 1 : /^[0-9]{1,3}$/.test(t) ? parseInt(t, 10) : 0;
  }
  function price(v) { return Math.max(0, num(v)); }
  function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function money(cents) { return (cents < 0 ? "-" : "") + state.meta.currency + (Math.abs(cents) / 100).toFixed(2); }
  function personName(id) { const p = state.people[id]; return p ? (String(p.name || "").trim() || "Unnamed") : "?"; }

  // Round fractional cent amounts so they sum exactly to `target` (largest remainder).
  function allocate(rawById, target) {
    const out = {}; let sum = 0;
    const rems = Object.keys(rawById).map((id) => {
      const f = Math.floor(rawById[id] + 1e-9);
      out[id] = f; sum += f;
      return { id, r: rawById[id] - f };
    });
    let diff = target - sum;
    rems.sort((a, b) => (diff > 0 ? b.r - a.r : a.r - b.r));
    // diff is normally a few cents; the cap stops crafted huge numbers from freezing the page.
    for (let i = 0, steps = 0; diff !== 0 && rems.length && steps < rems.length * 2; i = (i + 1) % rems.length, steps++) {
      out[rems[i].id] += diff > 0 ? 1 : -1;
      diff += diff > 0 ? -1 : 1;
    }
    return out;
  }

  function compute() {
    const people = sorted(state.people);
    const rate = num(state.meta.service) / 100;
    const base = {}, lines = {};
    people.forEach((p) => { base[p.id] = 0; lines[p.id] = []; });
    let subtotal = 0, unassigned = 0, total = 0, unassignedWithService = 0;
    const scan = scanMode(), over = [], unclaimed = [], raw = {};
    people.forEach((p) => { raw[p.id] = 0; });

    sorted(state.items).forEach((it) => {
      const c = price(it.price) * qty(it.qty) * 100;
      // Items marked "No service" (e.g. an optional donation) don't get the service charge on top.
      const f = it.noService ? 1 : 1 + rate, ns = !!it.noService;
      subtotal += c; total += c * f;
      if (scan) {
        // Each claim is n units, split equally between the claimer and anyone they shared it with.
        const unit = price(it.price) * 100, name = String(it.name || "").trim() || "Item";
        let claimed = 0;
        Object.keys(it.units || {}).forEach((pid) => {
          const u = it.units[pid];
          if (!own(base, pid) || !(u.n > 0)) return;
          claimed += u.n;
          const who = [pid].concat(Object.keys(u.with || {}).filter((w) => w !== pid && own(base, w)));
          who.forEach((id) => {
            base[id] += (unit * u.n) / who.length;
            raw[id] += ((unit * u.n) / who.length) * f;
            lines[id].push({ name, amt: (unit * u.n) / who.length, n: who.length, q: u.n, ns });
          });
        });
        if (claimed < qty(it.qty)) {
          unassigned += (qty(it.qty) - claimed) * unit; unassignedWithService += (qty(it.qty) - claimed) * unit * f;
          unclaimed.push(name + (qty(it.qty) > 1 ? " (" + (qty(it.qty) - claimed) + " left)" : ""));
        }
        if (claimed > qty(it.qty)) over.push(name + " (" + claimed + " claimed, " + qty(it.qty) + " on the bill)");
        return;
      }
      const who = Object.keys(it.people || {}).filter((id) => own(base, id));
      if (!who.length) { unassigned += c; unassignedWithService += c * f; return; }
      who.forEach((id) => {
        base[id] += c / who.length;
        raw[id] += (c / who.length) * f;
        lines[id].push({ name: String(it.name || "").trim() || "Item", amt: c / who.length, n: who.length, q: qty(it.qty), ns });
      });
    });

    const totalC = Math.round(total);
    const subtotalC = Math.round(subtotal);
    // Over-claimed items mean people's shares add up to more than the items; count what was claimed.
    const assignedC = scan ? Math.round(Object.values(raw).reduce((t, v) => t + v, 0)) : Math.round(total - unassignedWithService);
    const share = allocate(raw, assignedC);
    // Each person's service charge; the odd penny from rounding their share stays with the food, so it
    // never shows up as a "-£0.01 service" on a bill without service.
    const svc = {};
    Object.keys(raw).forEach((id) => { svc[id] = Math.round(raw[id] - base[id]); });

    const paid = {}, payLines = {}; people.forEach((p) => { paid[p.id] = 0; payLines[p.id] = []; });
    let paidTotal = 0;
    sorted(state.payments).forEach((pm) => {
      const c = Math.round(num(pm.amount) * 100);
      if (own(paid, pm.personId)) { paid[pm.personId] += c; paidTotal += c; payLines[pm.personId].push({ note: String(pm.note || "").trim(), c }); }
    });

    const net = {};
    people.forEach((p) => { net[p.id] = share[p.id] - paid[p.id]; });

    const transfers = [];
    if (paidTotal === assignedC && unassigned === 0 && !over.length) {
      const debt = [], cred = [];
      people.forEach((p) => {
        if (net[p.id] > 0) debt.push({ id: p.id, v: net[p.id] });
        else if (net[p.id] < 0) cred.push({ id: p.id, v: -net[p.id] });
      });
      debt.sort((a, b) => b.v - a.v);
      cred.sort((a, b) => b.v - a.v);
      let i = 0, j = 0;
      while (i < debt.length && j < cred.length) {
        const amt = Math.min(debt[i].v, cred[j].v);
        transfers.push({ from: debt[i].id, to: cred[j].id, amt });
        debt[i].v -= amt; cred[j].v -= amt;
        if (!debt[i].v) i++;
        if (!cred[j].v) j++;
      }
    }

    const billC = String(state.meta.billTotal).trim() === "" ? null : Math.round(num(state.meta.billTotal) * 100);
    return {
      people, subtotalC, serviceC: totalC - subtotalC, totalC, unassignedC: Math.round(unassignedWithService),
      share, svc, paid, payLines, paidTotal, net, transfers, lines, billC, assignedC, over, unclaimed,
    };
  }

  // ---------- rendering ----------
  // Lists are updated in place (keyed by id) so the field someone is typing in
  // is never replaced, even when a friend's edit arrives.
  function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
  function setVal(input, v) { v = v == null ? "" : String(v); if (document.activeElement !== input && input.value !== v) input.value = v; }
  function setHTML(node, html) { if (node._html !== html) { node.innerHTML = html; node._html = html; } }
  function syncList(box, list, make, update) {
    const existing = new Map(Array.from(box.children, (c) => [c.dataset.id, c]));
    let prev = null;
    list.forEach((obj) => {
      let row = existing.get(obj.id);
      if (!row) { row = make(obj); row.dataset.id = obj.id; }
      existing.delete(obj.id);
      update(row, obj);
      const want = prev ? prev.nextSibling : box.firstChild;
      if (row !== want) box.insertBefore(row, want);
      prev = row;
    });
    existing.forEach((row) => row.remove());
  }
  function personOptions(people, first) {
    return (first || "") + people.map((p) => '<option value="' + p.id + '">' + esc(String(p.name || "").trim() || "Unnamed") + "</option>").join("");
  }
  // Names already picked on another phone can't be chosen again.
  function pickerOptions(first) {
    return (first || "") + sorted(state.people).map((p) => {
      const by = claimedBy(p.id), taken = !!by && by !== authUid;
      return '<option value="' + p.id + '"' + (taken ? " disabled" : "") + ">" + esc(String(p.name || "").trim() || "Unnamed") + (taken ? " (taken)" : "") + "</option>";
    }).join("");
  }
  // Each person keeps a colour based on their position in the list.
  function colorOf(id) {
    const i = sorted(state.people).findIndex((p) => p.id === id);
    return COLORS[(i < 0 ? 0 : i) % COLORS.length];
  }
  function initial(id) { const n = String((state.people[id] || {}).name || "").trim(); return n ? esc(n[0].toUpperCase()) : "?"; }
  function avatar(id, sm) { return '<span class="av' + (sm ? " sm" : "") + '" style="--c:' + colorOf(id) + '">' + initial(id) + "</span>"; }
  function bigMoney(cents) {
    const s = (Math.abs(cents) / 100).toFixed(2).split(".");
    return (cents < 0 ? "-" : "") + '<span class="cur">' + esc(state.meta.currency) + "</span>" + s[0] + '<span class="dec">.' + s[1] + "</span>";
  }

  // "Monzo", "Revolut", "Monzo & Revolut" or "" for the apps someone can be paid through.
  function payApps(pid) {
    const p = state.people[pid] || {};
    return Object.keys(PAY_APPS).filter((k) => p[k]).map((k) => PAY_APPS[k].name).join(" & ");
  }

  // The same button text everywhere someone's pay links are shown.
  function payLinksLabel(pid) {
    const apps = payApps(pid);
    return apps ? '<span class="tk"></span>' + (apps.includes("&") ? "Both" : apps) : "Pay links";
  }

  function renderBar() {
    const bar = $("#sharedBar");
    bar.hidden = !billId;
    if (!billId) return;
    $("#dot").classList.toggle("on", online && loaded);
    $("#statusText").textContent = !loaded ? "Connecting…" : online ? "Live" : "Offline · will sync";
    const sel = $("#meSel");
    setHTML(sel, pickerOptions('<option value="">Choose…</option>'));
    if (document.activeElement !== sel) sel.value = meId() || "";
    sel.disabled = !!meId();   // your name is fixed once picked
    bar.classList.toggle("needme", loaded && !meId());
    $("#role").textContent = isAdmin ? "Admin" : "Guest";
    $("#role").classList.toggle("admin", isAdmin);
    $("#adminLink").hidden = !isAdmin || !adminKey;
    const code = state.meta.code;
    $("#codePill").hidden = !isAdmin || !code;
    // Once you've confirmed who you are, you can add your own Monzo / Revolut username.
    const mine = meId(), apps = mine ? payApps(mine) : "";
    $("#myMonzo").hidden = !mine;
    $("#myMonzo").classList.toggle("on", !!apps);
    setHTML($("#myMonzo"), mine ? payLinksLabel(mine) : "");
    if (code) $("#codePill").textContent = formatCode(code);
  }

  function render() {
    document.body.classList.toggle("home", home);
    if (home) return renderHome();
    const people = sorted(state.people);
    const items = sorted(state.items);
    const payments = sorted(state.payments);

    const admin = canAdmin();
    document.querySelectorAll('[data-sec="meta"] [data-f]').forEach((i) => { setVal(i, state.meta[i.dataset.f]); i.disabled = !admin; });
    document.querySelectorAll("[data-admin]").forEach((b) => { b.hidden = !admin; });
    const guest = !!billId && !isAdmin;
    document.body.classList.toggle("guest", guest);
    document.body.classList.toggle("unpicked", !picked());
    $("#billTitle").textContent = loaded ? billName(state.meta) : billName(bills().find((b) => b.id === billId));
    syncEntry();
    const scan = scanMode();
    document.body.classList.toggle("scan", scan);
    // Manual or Scan is chosen once, before any items; after that the choice is gone for good.
    const chosen = modeChosen();
    $("#modeSeg").hidden = !admin || chosen;
    document.querySelectorAll("#modeSeg [data-mode]").forEach((b) => { b.disabled = !admin; });
    $("#addItem").hidden = !picked() || (scan && !admin) || !chosen;
    $("#addItem").classList.toggle("primary", !scan);
    $("#scanBtn").hidden = !scan || !admin;
    // People are confirmed once by the admin; after that nobody can be added, removed or renamed,
    // and only then does Food & drinks appear for the admin.
    const peopleLocked = !!state.meta.peopleLocked;
    $("#peopleActions").hidden = !admin || peopleLocked;
    $("#itemsCard").hidden = isAdmin && !peopleLocked;
    $("#peopleEmpty").hidden = people.length > 0;
    $("#peopleCount").textContent = people.length ? people.length + (people.length === 1 ? " person" : " people") + (peopleLocked ? " · confirmed" : "") : "";
    $("#paidAll").textContent = "Pay the rest";
    const myPerson = meId(), myRow = myself();
    const shown = guest && !scan
      ? items.filter((it) => (it.createdBy && it.createdBy === authUid) || (myPerson && (it.people || {})[myPerson]))
      : items;
    $("#itemsHead").textContent = "Food & drinks";
    $("#previewReceipt").hidden = !guest || !meId() || !!state.meta.locked;
    $("#previewReceipt").textContent = receiptPreview ? "Hide my receipt" : "See my receipt";
    $("#itemsEmpty").textContent = !chosen ? (admin ? "Choose how to add the items: type them in, or scan the receipt." : "Nothing yet.")
      : !scan ? "Nothing yet. Add what was ordered." : admin ? "Nothing yet. Scan the receipt to fill this in." : "Nothing yet. The receipt hasn't been scanned.";
    $("#itemsCount").textContent = shown.length ? shown.length + (shown.length === 1 ? " item" : " items") : "";
    renderBar();

    syncList($("#people"), people,
      () => el('<div class="prow"><span class="av"></span><input data-f="name" placeholder="Name" autocomplete="off" maxlength="40">' +
        '<button class="btn small" data-act="monzo"></button>' +
        '<button class="btn small" data-act="unlink">Unlink</button>' +
        '<button class="icon-btn" data-act="delPerson" aria-label="Remove">' + ICON.x + "</button></div>"),
      (row, p) => {
        const av = row.querySelector(".av");
        av.style.setProperty("--c", colorOf(p.id));
        setHTML(av, initial(p.id));
        const input = row.querySelector("input");
        setVal(input, p.name);
        input.disabled = !admin || peopleLocked;
        row.classList.toggle("ok", peopleLocked);
        const by = claimedBy(p.id);
        row.querySelector('[data-act="unlink"]').hidden = !admin || !by || by === authUid;
        const mz = row.querySelector('[data-act="monzo"]');
        mz.hidden = !admin;
        const apps = payApps(p.id);
        mz.classList.toggle("on", !!apps);
        setHTML(mz, payLinksLabel(p.id));
        row.lastChild.hidden = !admin || peopleLocked;
      });

    const chipsFor = (it) => {
      const on = it.people || {}, dis = canEditItem(it) && editing.has(it.id) ? "" : " disabled";
      const all = people.length > 1 && people.every((p) => on[p.id]);
      return people.map((p) => '<button class="chip' + (on[p.id] ? " on" : "") + '" data-act="toggle" data-p="' + p.id + '"' + dis + ">" +
        avatar(p.id, true) + esc(String(p.name || "").trim() || "Unnamed") + "</button>").join("") +
        (people.length > 1 && !dis && !all ? '<button class="chip all" data-act="all">Everyone</button>' : "");
    };
    $("#itemsEmpty").hidden = shown.length > 0;
    syncList($("#items"), shown,
      () => el('<div class="item"><div class="item-row">' +
        '<button class="claim" data-act="claim"></button>' +
        '<input class="name" data-f="name" placeholder="What was it?" autocomplete="off" maxlength="60">' +
        '<span class="name-text"></span><span class="who"></span>' +
        '<input class="qty" data-f="qty" placeholder="×1" inputmode="numeric" aria-label="Quantity" maxlength="6">' +
        '<label class="money"><span class="cur"></span><input data-f="price" placeholder="0.00" inputmode="decimal" aria-label="Price each" maxlength="12"></label>' +
        '<button class="icon-btn" data-act="delItem" aria-label="Remove">' + ICON.x + '</button>' +
        '<button class="icon-btn" data-act="editItem" aria-label="Edit">' + ICON.edit + "</button></div>" +
        '<div class="item-foot"><button class="btn split" data-act="split"></button><div class="chips"></div><span class="units-left"></span>' +
        '<button class="btn nosvc" data-act="noService">No service</button>' +
        '<button class="btn confirm" data-act="confirmItem">Confirm</button></div></div>'),
      (row, it) => {
        const mine = canEditItem(it), open = mine && editing.has(it.id);
        row.querySelector(".cur").textContent = state.meta.currency;
        row.querySelectorAll("[data-f]").forEach((i) => {
          setVal(i, it[i.dataset.f]);
          i.disabled = !open;
          if (!open) i.scrollLeft = 0;   // show the start of a long name, not wherever typing left it
        });
        row.querySelector('[data-act="delItem"]').hidden = !open;
        row.querySelector('[data-act="confirmItem"]').hidden = !open;
        // The pencil keeps its column on everyone's rows so prices line up, even where you can't edit.
        const pencil = row.querySelector('[data-act="editItem"]');
        pencil.hidden = open;
        pencil.style.visibility = mine ? "" : "hidden";
        row.querySelector(".who").hidden = open;
        setNameText(row, it, "");
        row.classList.toggle("locked", !open);
        // Only worth showing when there is a service charge (or the item is already marked).
        const svcSwitch = row.querySelector('[data-act="noService"]');
        svcSwitch.hidden = !open || (!it.noService && !(num(state.meta.service) > 0));
        svcSwitch.classList.toggle("on", !!it.noService);
        setHTML(svcSwitch, (it.noService ? '<span class="tk"></span>' : "") + "No service");
        row.querySelector('[data-act="claim"]').hidden = !scan;
        if (scan) return updateScanItem(row, it, open);
        row.querySelector(".units-left").textContent = "";
        row.querySelector(".chips").classList.remove("pick");
        // confirmed = read-only, priced and assigned to someone
        row.classList.toggle("ok", !open && price(it.price) > 0 && qty(it.qty) > 0 && Object.keys(it.people || {}).some((id) => state.people[id]));
        row.classList.toggle("unassigned", !Object.keys(it.people || {}).some((id) => state.people[id]));
        setHTML(row.querySelector(".chips"), chipsFor(it));
        // Guests: an item is just theirs unless they open "Split with others".
        // Everyone: an item is just yours unless you open "Split with others" (that's also how you
        // give an item to someone else entirely: split, tick them, untick yourself).
        // If the app doesn't know who you are yet, the names stay behind a "Who had it?" button instead.
        const assigned = Object.keys(it.people || {}).filter((p) => state.people[p]);
        const others = assigned.filter((p) => p !== myRow);
        const splitting = (myRow ? others.length > 0 : false) || splitOpen.has(it.id);
        const simple = open;
        const splitBtn = row.querySelector('[data-act="split"]');
        splitBtn.hidden = !simple;
        splitBtn.textContent = myRow
          ? (splitting ? "Just me" : "Split with others")
          : (splitting ? "Done" : assigned.length ? "Who had it: " + assigned.map(personName).join(", ") : "Who had it?");
        row.classList.toggle("solo", simple && !splitting);
        row.classList.toggle("splitting", simple && splitting);
        setHTML(row.querySelector(".who"), whoHTML(assigned, it));
        row.querySelector(".item-foot").hidden = !open;
      });

    // A confirmed item's name, with short notes underneath ("2 left", "No service").
    function setNameText(row, it, extra) {
      const notes = [qty(it.qty) > 1 ? "×" + qty(it.qty) : "", extra, it.noService ? "No service" : ""].filter(Boolean).join(" · ");
      setHTML(row.querySelector(".name-text"), '<span class="nt">' + esc(String(it.name || "").trim() || "Item") + "</span>" + (notes ? "<small>" + esc(notes) + "</small>" : ""));
    }
    // Who had it, as initial bubbles: up to 3, then "+2".
    function whoHTML(ids) {
      const shown = ids.length > 3 ? ids.slice(0, 2) : ids;
      const stack = ids.length ? '<span class="stack">' + shown.map((p) => avatar(p, true)).join("") + "</span>" +
        (ids.length > shown.length ? "<span>+" + (ids.length - shown.length) + "</span>" : "") : "";
      return stack;
    }

    // Scan mode: the box claims units of the item; the foot shows who has claimed what and what's left.
    function updateScanItem(row, it, open) {
      const me = myself(), units = it.units || {}, q = qty(it.qty), claimed = claimedOf(it), left = q - claimed;
      const mineN = me && units[me] && units[me].n > 0 ? units[me].n : 0;
      const box = row.querySelector('[data-act="claim"]');
      box.textContent = mineN ? String(mineN) : "";
      box.classList.toggle("on", mineN > 0);
      box.disabled = !canClaim() || (!mineN && left <= 0);
      box.setAttribute("aria-label", mineN ? "You had " + mineN + ", tap to change" : "Tap if you had this");
      row.classList.toggle("ok", !open && price(it.price) > 0 && q > 0 && claimed === q);
      row.classList.toggle("unassigned", claimed > q);
      const leftText = claimed > q ? claimed - q + " too many" : q > 1 && left > 0 ? left + " left" : "";
      row.querySelector(".units-left").textContent = open ? leftText : "";
      // everyone who has a share: the claimers and whoever they're splitting with
      const sharing = [];
      Object.keys(units).filter((pid) => state.people[pid] && units[pid].n > 0).forEach((pid) => {
        [pid].concat(Object.keys(units[pid].with || {})).forEach((x) => { if (state.people[x] && !sharing.includes(x)) sharing.push(x); });
      });
      setHTML(row.querySelector(".who"), whoHTML(sharing, it));
      setNameText(row, it, leftText);
      const sharedWith = mineN ? Object.keys(units[me].with || {}).filter((p) => state.people[p] && p !== me) : [];
      const splitting = !open && mineN > 0 && (sharedWith.length > 0 || splitOpen.has(it.id));
      const splitBtn = row.querySelector('[data-act="split"]');
      splitBtn.hidden = open || !mineN || !canClaim();
      splitBtn.textContent = splitting ? "Just me" : "Split with others";
      row.classList.toggle("solo", false);
      row.classList.toggle("splitting", splitting);
      const chips = row.querySelector(".chips");
      chips.classList.toggle("pick", splitting);
      let h;
      if (open) {          // the admin, editing: tap a name to give them one more (cycles back to none)
        h = people.map((p) => {
          const n = units[p.id] && units[p.id].n > 0 ? units[p.id].n : 0;
          return '<button class="chip' + (n ? " on" : "") + '" data-act="unit" data-p="' + p.id + '">' + avatar(p.id, true) +
            esc(personName(p.id)) + (n && q > 1 ? " ×" + n : "") + "</button>";
        }).join("");
      } else if (splitting) {   // who you're sharing your claim with
        h = people.filter((p) => p.id !== me).map((p) => '<button class="chip' + (sharedWith.includes(p.id) ? " on" : "") + '" data-act="with" data-p="' + p.id + '">' +
          avatar(p.id, true) + esc(personName(p.id)) + "</button>").join("");
      } else h = "";        // who has claimed it is in the row itself
      setHTML(chips, h);
      // A second line only for editing, or for splitting what you claimed.
      row.querySelector(".item-foot").hidden = !open && splitBtn.hidden && !splitting;
    }

    const opts = personOptions(people);
    $("#paymentsEmpty").hidden = payments.length > 0;
    syncList($("#payments"), payments,
      () => el('<div class="payrow"><select data-f="personId"></select>' +
        '<input data-f="note" placeholder="Note" maxlength="40">' +
        '<label class="money"><span class="cur"></span><input data-f="amount" placeholder="0.00" inputmode="decimal" maxlength="12"></label>' +
        '<button class="icon-btn" data-act="delPayment" aria-label="Remove">' + ICON.x + "</button></div>"),
      (row, pm) => {
        const sel = row.firstChild;
        setHTML(sel, opts);
        if (document.activeElement !== sel) sel.value = pm.personId;
        row.querySelector(".cur").textContent = state.meta.currency;
        row.querySelectorAll("input[data-f]").forEach((i) => setVal(i, pm[i.dataset.f]));
        row.querySelectorAll("[data-f]").forEach((i) => { i.disabled = !admin; });
        row.lastChild.hidden = !admin;
      });

    renderResults();
    renderChecks();
    renderDisplay();
    renderReceipt();
  }

  // The calculator-style screen at the top.
  function renderDisplay() {
    const box = $("#display");
    if (!loaded) { box.innerHTML = '<div class="d-top"><span class="d-label">Total</span></div><div class="d-total">…</div><div class="d-sub">Loading bill</div>'; return; }
    const r = last;
    const tag = state.meta.locked ? '<span class="d-tag">Locked</span>' : "";
    const pct = r.totalC ? Math.min(100, Math.round((r.paidTotal / r.totalC) * 100)) : 0;
    setHTML(box,
      '<div class="d-top"><span class="d-label">Total</span>' + tag + "</div>" +
      '<div class="d-total">' + bigMoney(r.totalC) + "</div>" +
      '<div class="d-sub">Food ' + money(r.subtotalC) + " · Service " + esc(String(num(state.meta.service))) + "% " + money(r.serviceC) + "</div>" +
      '<div class="d-bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="d-paid"><span>Paid ' + money(r.paidTotal) + "</span><span>" +
      (r.totalC > r.paidTotal ? money(r.totalC - r.paidTotal) + " to go" : r.totalC ? "Fully paid" : "") + "</span></div>");
  }

  // Once the admin locks the bill, everyone sees their own receipt instead of the editor.
  let receiptWho = null;   // whose receipt the admin is looking at (defaults to their own)
  let receiptPreview = false;   // a guest looking at their receipt before the bill is locked
  function receiptPerson() {
    if (!canAdmin()) return meId();
    if (receiptWho && state.people[receiptWho]) return receiptWho;
    const first = sorted(state.people)[0];
    return myself() || (first && first.id);
  }

  function renderReceipt() {
    const box = $("#receipt");
    const locked = loaded && !!state.meta.locked;
    const preview = loaded && !locked && receiptPreview && !canAdmin() && !!meId();
    document.body.classList.toggle("is-locked", locked);
    box.hidden = !locked && !preview;
    if (preview) { if (box.previousElementSibling !== $("#itemsCard")) $("#itemsCard").after(box); }
    else if (box.previousElementSibling !== $("#display")) $("#display").after(box);
    if (!locked && !preview) return;
    const r = last, who = receiptPerson();
    const admin = canAdmin(), me = myself();
    const first = who ? "" : '<option value="">Who are you?</option>';
    const viewOptions = r.people.map((p) => '<option value="' + p.id + '">' + esc(personName(p.id)) + (p.id === me ? " (you)" : "") + "</option>").join("");
    let h = '<div class="receipt-head"><h2>' + (admin && who !== me ? "Viewing" : preview ? "Your receipt so far" : "Your receipt") + '</h2><select id="receiptWho">' +
      (admin ? viewOptions : pickerOptions(first)) + "</select></div>";

    if (!who) h += '<p class="empty">Pick your name to see what you owe.</p>';
    else {
      const you = who === me;
      const name = esc(personName(who)), net = r.net[who];
      if (net > 0) {
        h += '<div class="banner owe"><div class="lead">' + (you ? "You need" : name + " needs") + ' to pay</div><div class="amt">' + money(net) + "</div>" +
          r.transfers.filter((t) => t.from === who).map((t) => {
            const to = state.people[t.to] || {}, links = [["monzo", monzoLink(t.to, t.amt)], ["revolut", revolutLink(t.to, t.amt)]].filter((l) => l[1]);
            return '<div class="to">' + avatar(t.to, true) + "to " + esc(personName(t.to)) + "<b>" + money(t.amt) + "</b></div>" +
              links.map(([k, link]) => '<a class="btn pay ' + k + '" href="' + esc(link) + '" target="_blank" rel="noopener">Pay on ' + PAY_APPS[k].name +
                " · @" + esc(to[k]) + "</a>").join("") +
              (links.length ? '<div class="pay-note">' + (links.length > 1 ? "Your app" : PAY_APPS[links[0][0]].name) +
                " will show who you’re paying: check it’s " + esc(personName(t.to)) + ".</div>" : "");
          }).join("") + "</div>";
      } else if (net < 0) {
        const canAdd = you && !payApps(who) && (billId ? !!meId() : true);
        h += '<div class="banner owed"><div class="lead">' + (you ? "You're" : name + " is") + ' owed</div><div class="amt">' + money(-net) + "</div>" +
          r.transfers.filter((t) => t.to === who).map((t) => '<div class="to">' + avatar(t.from, true) + "from " + esc(personName(t.from)) + "<b>" + money(t.amt) + "</b></div>").join("") +
          (canAdd ? '<button class="btn pay" data-act="addMyMonzo">Add your Monzo or Revolut so they can pay you in one tap</button>' : "") + "</div>";
      } else {
        h += '<div class="banner settled"><div class="lead">' + (you ? "You're" : name + " is") + ' all square</div><div class="amt">' + money(0) + "</div>Nothing to pay or collect.</div>";
      }

      const food = r.share[who] - r.svc[who];
      h += '<div class="lines">' + r.lines[who].map((l) =>
        "<span>" + esc(l.name) + (l.q !== 1 ? " ×" + l.q : "") + (l.n > 1 ? ' <span class="muted">· split ' + l.n + " ways</span>" : "") +
        (l.ns ? ' <span class="muted">· no service</span>' : "") +
        "</span><span>" + money(Math.round(l.amt)) + "</span>").join("");
      if (!r.lines[who].length) h += '<span class="muted">No items</span><span></span>';
      h += '<span class="sep"></span>' +
        '<span class="muted">Food &amp; drinks</span><span>' + money(food) + "</span>" +
        '<span class="muted">Service (' + esc(String(num(state.meta.service))) + "%)</span><span>" + money(r.svc[who]) + "</span>" +
        '<span class="strong">' + (you ? "Your share" : "Share") + '</span><span class="strong">' + money(r.share[who]) + "</span>";
      r.payLines[who].forEach((p) => {
        h += '<span class="muted">Already paid' + (p.note ? " · " + esc(p.note) : "") + "</span><span>−" + money(p.c) + "</span>";
      });
      h += '<span class="sep"></span><span class="big">' + (net > 0 ? "To pay" : net < 0 ? "To receive" : "Balance") +
        '</span><span class="big">' + money(Math.abs(net)) + "</span></div>";
      h += '<div class="actions"><button class="btn primary" data-act="shareReceipt">' + ICON.share + "Share receipt</button></div>";
    }
    if (canAdmin()) {
      h += '<div class="actions"><button class="btn" data-act="unlock">' + ICON.unlock + "Unlock</button>" +
        '<button class="btn danger" data-act="settle">' + (billId ? "Settle &amp; delete" : "Delete bill") + "</button></div>";
    }
    box.innerHTML = h;
    $("#receiptWho").value = who || "";
    $("#receiptWho").disabled = !admin && !!meId();
  }

  function receiptText(who) {
    const r = last, net = r.net[who];
    let t = "Receipt for " + personName(who) + "\n\n";
    r.lines[who].forEach((l) => {
      t += l.name + (l.q !== 1 ? " ×" + l.q : "") + (l.n > 1 ? " (split " + l.n + " ways)" : "") + (l.ns ? " (no service)" : "") + ": " + money(Math.round(l.amt)) + "\n";
    });
    t += "Share incl. " + num(state.meta.service) + "% service: " + money(r.share[who]) + "\n";
    if (r.paid[who]) t += "Already paid: " + money(r.paid[who]) + "\n";
    t += "\n";
    if (net > 0) r.transfers.filter((x) => x.from === who).forEach((x) => {
      t += "Pay " + personName(x.to) + " " + money(x.amt) + "\n";
      const m = monzoLink(x.to, x.amt), rv = revolutLink(x.to, x.amt);
      if (m) t += "Monzo: " + m + "\n";
      if (rv) t += "Revolut: " + rv + "\n";
    });
    else if (net < 0) r.transfers.filter((x) => x.to === who).forEach((x) => { t += personName(x.from) + " pays you " + money(x.amt) + "\n"; });
    else t += "All square.";
    return t.trim();
  }

  // What has to agree before the bill can be locked: the receipt's total, the items + service, who had what,
  // and what's been paid. ok: true (fine), false (to fix) or null (can't tell yet).
  function checks(r) {
    const admin = canAdmin(), scan = scanMode(), out = [];
    const noPrice = sorted(state.items).filter((it) => price(it.price) <= 0 || qty(it.qty) <= 0).length;
    out.push({ key: "bill", label: "Bill total", ok: r.billC !== null, value: r.billC !== null ? money(r.billC) : "Not entered" });
    const items = { key: "items", label: "Items total", value: money(r.totalC) };
    if (!r.totalC) Object.assign(items, { ok: false, value: "No items yet" });
    else if (noPrice) Object.assign(items, { ok: false, note: noPrice + (noPrice === 1 ? " item needs" : " items need") + " a price" });
    else if (r.billC === null) Object.assign(items, { ok: null, action: admin && { act: "setTotal", label: "Set bill = total" } });
    else if (r.billC === r.totalC) items.ok = true;
    else {
      const d = r.billC - r.totalC;
      Object.assign(items, { ok: false, note: d > 0 ? money(d) + " still to add" : money(-d) + " too much" });
    }
    out.push(items);
    // In scan mode people claim items themselves, so whether everything's been claimed is worth tracking.
    if (scan) {
      const who = { key: "items", label: "Claimed" };
      if (!r.totalC) Object.assign(who, { ok: null, value: "–" });
      else if (r.over.length) Object.assign(who, { ok: false, value: r.over.length + " over", note: "claimed more than ordered" });
      else if (r.unassignedC) Object.assign(who, { ok: false, value: money(r.unassignedC), note: "not claimed yet" });
      else Object.assign(who, { ok: true, value: "Everything" });
      out.push(who);
    }
    // Payments cover what the receipt says (once it's typed in), even while items are still being added.
    const target = r.billC !== null ? r.billC : r.totalC, rem = target - r.paidTotal, me = myself();
    const paid = { key: "paid", label: "Payments total", value: money(r.paidTotal) };
    if (!target) paid.ok = null;
    else if (rem === 0) paid.ok = true;
    else if (rem > 0) Object.assign(paid, { ok: false, note: money(rem) + " to go", action: admin && { act: "paidRest", label: "Pay the rest" } });
    else Object.assign(paid, { ok: false, note: money(-rem) + " too much" });
    out.push(paid);
    return out;
  }
  function renderChecks() {
    const box = $("#checks");
    box.hidden = !loaded || !!state.meta.locked;
    if (box.hidden) return;
    const list = checks(last), toFix = list.filter((c) => c.ok === false).length;
    setHTML(box, '<div class="card-head"><h2>Checklist</h2><span class="count">' + (toFix ? toFix + " to fix" : "All good") + "</span></div>" + list.map((c) =>
      '<div class="check ' + (c.ok === true ? "ok" : c.ok === null ? "na" : "bad") + '" data-go="' + c.key + '" role="button" tabindex="0">' +
      '<span class="cl">' + esc(c.label) + "</span>" +
      '<span class="cv">' + esc(c.value) + (c.note ? "<small>" + esc(c.note) + "</small>" : "") + "</span>" +
      (c.action ? '<span class="cact"><button class="btn small dark" data-act="' + c.action.act + '">' + esc(c.action.label) + "</button></span>" : "") +
      "</div>").join(""));
  }

  let last = null;
  function renderResults() {
    const box = $("#results");
    if (!loaded) { box.innerHTML = '<div class="card-head"><h2>Split</h2></div><p class="empty">Loading bill…</p>'; return; }
    const r = compute(); last = r;
    const open = new Set(Array.from(box.querySelectorAll("details[open]"), (d) => d.dataset.p));
    let h = '<div class="card-head"><h2>' + (state.meta.locked ? "Everyone" : "Split") + "</h2></div>";

    r.people.forEach((p) => {
      const id = p.id, net = r.net[id];
      const status = net > 0 ? '<span class="owe">owes ' + money(net) + "</span>"
                   : net < 0 ? '<span class="owed">is owed ' + money(-net) + "</span>"
                   : '<span class="settled">all square</span>';
      let bd = r.lines[id].map((l) => {
        const label = esc(l.name) + (l.q !== 1 ? " ×" + l.q : "") + (l.n > 1 ? " · 1/" + l.n : "");
        return "<span>" + label + "</span><span>" + money(Math.round(l.amt)) + "</span>";
      }).join("");
      const food = r.share[id] - r.svc[id];
      bd += '<span class="sep"></span>' +
        "<span>Food &amp; drinks</span><span>" + money(food) + "</span>" +
        "<span>+ service</span><span>" + money(r.svc[id]) + "</span>" +
        "<span>− already paid</span><span>" + money(r.paid[id]) + "</span>";
      h += '<details class="person" data-p="' + id + '"' + (open.has(id) ? " open" : "") + "><summary>" + avatar(id) +
        '<div class="pinfo"><div class="pname">' + esc(personName(id)) + '</div><div class="pnet">' + status + "</div></div>" +
        '<div class="pshare">' + money(r.share[id]) + "</div>" + ICON.chev + "</summary>" +
        '<div class="lines">' + bd + "</div></details>";
    });

    if (r.transfers.length) {
      h += '<div class="subhead">Who pays whom</div>' + r.transfers.map((t) =>
        '<div class="transfer">' + avatar(t.from, true) + esc(personName(t.from)) + ICON.arrow + avatar(t.to, true) + esc(personName(t.to)) +
        "<b>" + money(t.amt) + "</b></div>").join("");
    }
    const canLock = canAdmin() && !state.meta.locked, toFix = checks(r).filter((c) => c.ok === false).length;
    h += '<div class="actions"><button class="btn' + (canLock ? "" : " primary") + '" data-act="share">' + ICON.share + "Summary</button>" +
      (canLock ? '<button class="btn dark" data-act="lock">' + ICON.lock + "Lock bill" + (toFix ? " (" + toFix + " to fix)" : "") + "</button>" : "") + "</div>";
    box.innerHTML = h;
  }

  function summaryText() {
    const r = last || compute();
    let t = "Bill split: total " + money(r.totalC) + " (incl. " + num(state.meta.service) + "% service)\n\n";
    r.people.forEach((p) => { t += personName(p.id) + ": " + money(r.share[p.id]) + (r.paid[p.id] ? " (paid " + money(r.paid[p.id]) + ")" : "") + "\n"; });
    if (r.transfers.length) {
      t += "\n";
      r.transfers.forEach((x) => { t += personName(x.from) + " → " + personName(x.to) + ": " + money(x.amt) + "\n"; });
    }
    return t.trim();
  }

  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2400);
  }
  function focusLast(box, sel) { const rows = box.children; if (rows.length) { const i = rows[rows.length - 1].querySelector(sel); if (i) i.focus(); } }
  function shareText(text) {
    if (navigator.share) navigator.share({ text }).catch(() => {});
    else copy(text);
  }

  // ---------- events ----------
  const NUMERIC = { price: [7, 2], amount: [7, 2], billTotal: [7, 2], service: [3, 2], qty: [3, 0] };
  function cleanNumber(v, [whole, dec]) {
    const m = String(v).replace(/[^0-9.,]/g, "").match(/^([0-9]*)([.,]?)([0-9]*)/);
    return m[1].slice(0, whole) + (dec ? m[2] + m[3].slice(0, dec) : "");
  }
  document.addEventListener("input", (e) => {
    const t = e.target, f = t.dataset.f;
    if (!f) return;
    if (NUMERIC[f]) { const c = cleanNumber(t.value, NUMERIC[f]); if (c !== t.value) t.value = c; }
    const sec = t.closest("[data-sec]").dataset.sec;
    if (sec === "meta") write({ ["meta/" + f]: t.value });
    else {
      const rowId = t.closest("[data-id]").dataset.id;
      write({ [sec + "/" + rowId + "/" + f]: t.value });
    }
  });

  $("#meSel").addEventListener("change", (e) => pickPerson(e.target.value));
  $("#receipt").addEventListener("change", (e) => {
    if (e.target.id !== "receiptWho") return;
    if (canAdmin()) { receiptWho = e.target.value; render(); }
    else pickPerson(e.target.value);
  });

  document.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const row = b.closest("[data-id]"), id = row && row.dataset.id;
    const paths = {};
    switch (b.dataset.act) {
      case "delPerson": {
        if (state.meta.peopleLocked) return;
        const hasPay = Object.values(state.payments).some((pm) => pm.personId === id);
        const hasItems = Object.values(state.items).some((it) => (it.people || {})[id] || (it.units || {})[id]);
        const gone = [hasItems && "what they had", hasPay && "their payments"].filter(Boolean);
        const name = String((state.people[id] || {}).name || "").trim();
        if (!(await ask(name ? "Remove " + name + "?" : "Remove this person?",
          gone.length ? "They're taken off the bill, along with " + gone.join(" and ") + "." : "They're taken off the bill.", "Remove", "danger"))) return;
        paths["people/" + id] = null;
        if (claimedBy(id)) { paths["claims/" + id] = null; paths["devices/" + claimedBy(id)] = null; }
        Object.keys(state.items).forEach((iid) => {
          const it = state.items[iid], u = it.units || {};
          if ((it.people || {})[id]) paths["items/" + iid + "/people/" + id] = null;
          if (u[id]) paths["items/" + iid + "/units/" + id] = null;
          Object.keys(u).forEach((o) => { if (o !== id && (u[o].with || {})[id]) paths["items/" + iid + "/units/" + o + "/with/" + id] = null; });
        });
        Object.keys(state.payments).forEach((pid) => { if (state.payments[pid].personId === id) paths["payments/" + pid] = null; });
        return write(paths);
      }
      case "monzo": return editPayLinks(id);
      case "addMyMonzo": return editPayLinks(myself());
      case "unlink":
        if (!(await ask("Unlink " + personName(id) + "?", "The phone that picked this name is released, so the right person can pick it.", "Unlink"))) return;
        return write({ ["claims/" + id]: null, ["devices/" + claimedBy(id)]: null });
      case "claim": return claimUnit(id, null);
      case "unit": return claimUnit(id, b.dataset.p);
      case "with": {
        const me = myself(), it = state.items[id], pid = b.dataset.p;
        if (!me || !it) return;
        const on = (((it.units || {})[me] || {}).with || {})[pid];
        return write({ ["items/" + id + "/units/" + me + "/with/" + pid]: on ? null : true, ["items/" + id + "/rev"]: (it.rev || 0) + 1 });
      }
      case "split": if (scanMode()) {
        const me = myself(), it = state.items[id], w = ((it.units || {})[me] || {}).with || {};
        if (Object.keys(w).length || splitOpen.has(id)) {
          splitOpen.delete(id);
          if (Object.keys(w).length) return write({ ["items/" + id + "/units/" + me + "/with"]: null, ["items/" + id + "/rev"]: (it.rev || 0) + 1 });
          return render();
        }
        splitOpen.add(id);
        return render();
      }
      // falls through: manual mode
      case "msplit": {
        const me = myself(), others = Object.keys(state.items[id].people || {}).filter((p) => p !== me);
        if (!me) {   // just show or hide the names
          if (splitOpen.has(id)) splitOpen.delete(id); else splitOpen.add(id);
          return render();
        }
        if (others.length || splitOpen.has(id)) {
          splitOpen.delete(id);
          return write({ ["items/" + id + "/people"]: me ? { [me]: true } : null });
        }
        splitOpen.add(id);
        return render();
      }
      case "noService": {
        const on = !!(state.items[id] || {}).noService;
        return write({ ["items/" + id + "/noService"]: on ? null : true });
      }
      case "editItem":
        editing.add(id);
        render();
        return row.querySelector(".name").focus();
      case "confirmItem":
        editing.delete(id);
        if (document.activeElement) document.activeElement.blur();
        toast("Saved to the bill");
        return render();
      case "toggle": {
        const pid = b.dataset.p, who = state.items[id].people || {}, on = who[pid];
        // Every item belongs to someone: the last person can only be unticked once someone else is ticked.
        if (on && !Object.keys(who).some((p) => p !== pid && state.people[p])) return toast("Tick who else had it first");
        return write({ ["items/" + id + "/people/" + pid]: on ? null : true });
      }
      case "all": {
        const on = state.items[id].people || {};
        const all = Object.keys(state.people).every((p) => on[p]);
        const map = {}; Object.keys(state.people).forEach((p) => { map[p] = true; });
        if (all) return;
        return write({ ["items/" + id + "/people"]: map });
      }
      case "delItem": {
        const it = state.items[id];
        if (!it) return;
        const name = String(it.name || "").trim(), claimed = scanMode() && claimedOf(it) > 0;
        if (!(await ask(name ? "Delete “" + name + "”?" : "Delete this item?",
          claimed ? "People have already claimed it. Their claims are removed too." : "It's removed from the bill.", "Delete", "danger"))) return;
        editing.delete(id); splitOpen.delete(id);
        return write({ ["items/" + id]: null });
      }
      case "delPayment": {
        const pm = state.payments[id];
        if (!pm) return;
        const amt = num(pm.amount) > 0 ? money(Math.round(num(pm.amount) * 100)) + " " : "";
        const who = state.people[pm.personId] ? " by " + personName(pm.personId) : "";
        if (!(await ask("Delete this payment?", "The " + amt + "payment" + who + " is removed from the bill.", "Delete", "danger"))) return;
        return write({ ["payments/" + id]: null });
      }
      case "paidRest": return paidTheRest();
      case "setTotal": {
        const r = last;
        if (!(await ask("Set the bill total to " + money(r.totalC) + "?",
          "Only if you've checked the bill says exactly " + money(r.totalC) + ". Comparing the two is how the app catches a missing or mistyped item.",
          "Yes, the bill says " + money(r.totalC)))) return;
        return write({ "meta/billTotal": (r.totalC / 100).toFixed(2) });
      }
      case "share": return shareText(summaryText());
      case "shareReceipt": return shareText(receiptText(receiptPerson()));
      case "lock": {
        const r = last, rem = r.assignedC - r.paidTotal;
        const bad = checks(r).filter((c) => c.ok === false);
        // A missing bill total on its own gets the "Set bill = total" popup below; anything else, see the checklist.
        if (bad.length && !(bad.length === 1 && bad[0].key === "bill")) {
          const box = $("#checks");
          box.scrollIntoView({ behavior: "smooth", block: "center" });
          box.classList.remove("flash"); void box.offsetWidth; box.classList.add("flash");
          return toast(bad.length + (bad.length === 1 ? " thing" : " things") + " to fix first");
        }
        if (!r.totalC) return info("Nothing to lock yet", "Add some items first.");
        const noPrice = sorted(state.items).filter((it) => price(it.price) <= 0 || qty(it.qty) <= 0).map((it) => String(it.name || "").trim() || "an unnamed item");
        if (noPrice.length) return info("Check these items", "These items need a price and a quantity of at least 1: " + noPrice.join(", ") + ".");
        if (r.over.length) return info("Claimed too many times", "These items have more claims than were ordered: " + r.over.join(", ") + ". Ask whoever claimed them to check.");
        if (r.unassignedC) return scanMode()
          ? info("Not everything is claimed", "Still to claim: " + r.unclaimed.join(", ") + ".")
          : info("Unassigned items", "Some items aren't assigned to anyone yet. Tick who had them first.");
        let billC = r.billC, confirmed = false;
        if (billC === null) {
          const set = await sheet({
            title: "Enter the bill total", text: "Type the total printed on the bill (under Bill) so it can be checked against the items.",
            buttons: [{ label: "Got it", value: false }, { label: "Set bill = total", value: true, kind: "primary" }],
          });
          if (set !== true) return;
          if (!(await ask("Set the bill total to " + money(r.totalC) + "?",
            "Only if you've checked the bill says exactly " + money(r.totalC) + ". Comparing the two is how the app catches a missing or mistyped item.",
            "Yes, the bill says " + money(r.totalC)))) return;
          write({ "meta/billTotal": (r.totalC / 100).toFixed(2) });
          billC = r.totalC; confirmed = true;   // and carry on locking: no need to tap Lock again
        }
        if (billC !== r.totalC) {
          const d = billC - r.totalC;
          return info("Totals don't match", "The bill says " + money(billC) + " but items + service come to " + money(r.totalC) + " (" +
            (d > 0 ? money(d) + " missing" : money(-d) + " too much") + "). Fix the items or service % so they match.");
        }
        if (rem > 0) return info("Not fully paid", money(rem) + " hasn't been paid by anyone yet. Record who paid the bill with the “paid the rest” button.");
        if (rem < 0) return info("Overpaid", "Payments come to " + money(-rem) + " more than the total. Fix the payments first.");
        const idle = r.people.filter((p) => !r.share[p.id] && !r.paid[p.id]).map((p) => personName(p.id));
        const msg = (idle.length ? idle.join(", ") + (idle.length > 1 ? " have" : " has") + " nothing on the bill.\n\n" : "") +
          "Everyone will see their own receipt, and nobody else can change items until you unlock it.";
        let me = myself();
        if (!me) {
          me = await askWhoYouAre();
          if (!me) return;
          write({ "meta/me": me });
        }
        // Just confirmed the total? Lock straight away, unless there's something worth pointing out first.
        if (!(confirmed && !idle.length) && !(await ask("Lock the bill?", msg, "Lock bill", "dark"))) return;
        receiptWho = null;
        return write({ "meta/locked": true });
      }
      case "unlock":
        if (await ask("Unlock the bill?", "Items can be edited again until you lock it.", "Unlock")) write({ "meta/locked": null });
        return;
      case "settle": {
        const text = billId ? "Only do this once everyone has paid. The bill is deleted for everyone and can't be recovered."
          : "The bill is deleted from this phone and can't be recovered.";
        if (!(await ask("Delete “" + billName(state.meta) + "”?", text, billId ? "Delete for everyone" : "Delete", "danger"))) return;
        const id = currentId();
        if (billId) {
          leaveShared();   // stop listening first, or the deletion would look like someone else's
          try { await (await backend()).deleteBill(id); }
          catch (err) { switchTo(id); return info("Couldn't delete the bill", "Are you online? " + err.message); }
        }
        dropBill(id); localId = null;
        toast("Bill deleted");
        return goHome();
      }
    }
  });

  $("#addPerson").addEventListener("click", () => {
    write({ ["people/" + uid()]: { name: "", order: Date.now() } });
    focusLast($("#people"), "input");
  });
  $("#addItem").addEventListener("click", async () => {
    const items = sorted(state.items), prev = items[items.length - 1];
    // A bill that's only on this phone doesn't know who you are yet: ask once, so items default to you.
    if (!billId && !scanMode() && !myself() && Object.keys(state.people).length) {
      const me = await askWhoYouAre();
      if (!me) return;   // every item starts as someone's, so we need to know whose
      write({ "meta/me": me });
    }
    const me = myself(), prevWho = prev ? Object.keys(prev.people || {}) : [];
    const item = { name: "", price: "", qty: "", order: Date.now() };
    if (authUid) item.createdBy = authUid;
    if (scanMode()) { /* claimed by tapping, not ticked */ }
    else if (me) item.people = { [me]: true };
    else if (prevWho.length === 1) item.people = { [prevWho[0]]: true };
    const newId = uid();
    editing.add(newId);
    write({ ["items/" + newId]: item });
    focusLast($("#items"), ".name");
  });
  // Confirm who's at the table, once: after this nobody can be added, removed or renamed.
  $("#confirmPeople").addEventListener("click", async () => {
    if (!canAdmin()) return;
    const people = sorted(state.people), names = people.map((p) => String(p.name || "").trim());
    if (people.length < 2) return info("Add everyone first", "Add everyone at the table, including you.");
    if (names.some((n) => !n)) return info("Some people have no name", "Give every person a name first.");
    const dupe = names.find((n, i) => names.findIndex((m) => m.toLowerCase() === n.toLowerCase()) !== i);
    if (dupe) return info("Two people are called " + dupe, "Use different names so everyone can find themselves.");
    const list = names.length > 1 ? names.slice(0, -1).join(", ") + " and " + names[names.length - 1] : names[0];
    if (!(await ask("Confirm " + names.length + " people?", list + ".\n\nThis can't be changed later: nobody can be added, removed or renamed.", "Confirm"))) return;
    write({ "meta/peopleLocked": true });
  });
  // The admin paid: one payment for whatever hasn't been paid yet.
  $("#paidAll").addEventListener("click", () => paidTheRest());
  async function paidTheRest() {
    const r = compute(), target = r.billC !== null ? r.billC : r.totalC, rem = target - r.paidTotal;
    if (!target) return info("Nothing to pay yet", "Type the bill total, or add the items first.");
    if (rem <= 0) return info("Already fully paid", "Payments already cover the total of " + money(target) + ".");
    const who = await sheet({
      title: "Who paid the rest?", text: money(rem) + (r.paidTotal ? ", what's left after the payments already added." : ", the whole bill."),
      buttons: sorted(state.people).map((p) => ({ label: personName(p.id), value: p.id })).concat([{ label: "Cancel", value: null }]),
    });
    if (!who) return;
    write({ ["payments/" + uid()]: { personId: who, amount: (rem / 100).toFixed(2), note: r.paidTotal ? "The rest" : "Whole bill", order: Date.now() } });
  }

  $("#checks").addEventListener("click", (e) => {
    const row = e.target.closest("[data-go]");
    if (!row || e.target.closest("[data-act]")) return;
    const go = row.dataset.go;
    if (go === "bill") {
      const input = $('[data-f="billTotal"]');
      if (!$("#billCard").hidden && canAdmin()) { input.scrollIntoView({ behavior: "smooth", block: "center" }); input.focus({ preventScroll: true }); }
      return;
    }
    const target = go === "paid" ? $("#paymentsCard") : $("#itemsCard");
    if (!target.hidden && getComputedStyle(target).display !== "none") target.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  $("#previewReceipt").addEventListener("click", () => {
    receiptPreview = !receiptPreview;
    render();
    if (receiptPreview) $("#receipt").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  $("#addPayment").addEventListener("click", () => {
    const first = sorted(state.people)[0];
    write({ ["payments/" + uid()]: { personId: meId() || (first ? first.id : ""), amount: "", note: "Deposit", order: Date.now() } });
    focusLast($("#payments"), '[data-f="amount"]');
  });
  $("#shareLink").addEventListener("click", shareLink);
  $("#adminLink").addEventListener("click", () => linkSheet("Admin link",
    "Opening this link makes that device an admin of this bill, able to change everything. Use it for your own other devices, or to make someone co-admin. Don't post it in the group chat.",
    shareUrl(true)));
  $("#newBill").addEventListener("click", async () => {
    if (await ask("Start a new bill?", "This one stays in your bills, so you can come back to it.", "New bill")) newBill();
  });
  $("#joinBill").addEventListener("click", joinBill);
  $("#scanBtn").addEventListener("click", () => $("#scanFile").click());
  $("#scanFile").addEventListener("change", (e) => { const f = e.target.files[0]; e.target.value = ""; scanReceipt(f); });
  // Manual: everyone adds what they had. Scan: the admin scans the receipt and everyone claims items from it.
  $("#modeSeg").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-mode]");
    if (!b || !canAdmin() || modeChosen()) return;
    const scan = b.dataset.mode === "scan";
    if (!(await ask(scan ? "Scan the receipt?" : "Type the items in?",
      scan ? "You scan the receipt and everyone ticks off what they had. You can't switch to typing items in later."
           : "Everyone adds what they had. You can't switch to scanning the receipt later.", scan ? "Scan receipt" : "Manual"))) return;
    write({ "meta/mode": scan ? "scan" : "manual" });
  });
  $("#myMonzo").addEventListener("click", () => editPayLinks(meId()));

  // Light/dark: follows the phone until you pick one here.
  function isDark() {
    const t = document.documentElement.dataset.theme;
    return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function paintTheme() {
    const dark = isDark();
    $("#themeBtn").innerHTML = dark ? ICON.sun : ICON.moon;
    document.querySelectorAll('meta[name="theme-color"]').forEach((m) => m.setAttribute("content", dark ? "#0b0b0c" : "#f2f1ec"));
  }
  $("#themeBtn").addEventListener("click", () => {
    const next = isDark() ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    lsSet("splitter-theme", next);
    paintTheme();
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintTheme);
  paintTheme();
  $("#billSwitch").addEventListener("click", openBills);
  $("#homeNew").addEventListener("click", newBill);
  $("#homeJoin").addEventListener("click", joinBill);
  $("#codePill").addEventListener("click", () => copy(state.meta.code));
  $("#homeBtn").addEventListener("click", () => { if (!home) goHome(); });
  $("#homeList").addEventListener("click", (e) => {
    const t = e.target.closest("[data-pick]");
    if (!t) return;
    if (t.dataset.pick.startsWith("rm:")) removeBill(t.dataset.pick.slice(3));
    else switchTo(t.dataset.pick);
  });
  window.addEventListener("hashchange", () => location.reload());

  // ---------- start ----------
  // Earlier versions kept a single bill on the phone; move it into the list.
  function migrate() {
    if (lsGet(BILLS)) return;
    const list = [], oldLocal = lsGet("bill-splitter-v2"), oldShared = lsGet("bill-splitter-shared");
    if (oldLocal) { const id = uid(); lsSet(LOCAL_PREFIX + id, oldLocal); list.push({ id, kind: "local", name: "", at: Date.now() }); lsSet(CURRENT, id); }
    if (oldShared) { list.unshift({ id: oldShared, kind: "shared", name: "", at: Date.now() }); lsSet(CURRENT, oldShared); }
    saveBills(list);
    lsSet("bill-splitter-v2", null); lsSet("bill-splitter-shared", null);
  }

  state = emptyBill();
  migrate();
  const m = location.hash.match(/^#b=([a-z0-9]{16,})(?:&k=([a-z0-9]{16,}))?$/);
  if (m && window.FIREBASE_CONFIG) {
    if (m[2]) history.replaceState(null, "", location.pathname + location.search + "#b=" + m[1]);   // don't leave the admin key in the URL
    upsertBill({ id: m[1], kind: "shared" });
    switchTo(m[1], m[2]);
  } else {
    goHome();
  }
  pruneLocalBills();
  if (home) render();
  if (window.FIREBASE_CONFIG) pruneGoneBills();   // also preloads Firebase so "Share" is instant

  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
